<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepwise English — английский A1–C2 и подготовка к DET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee;--surface:#fffdf9;--surface2:#f0ebe3;--ink:#1c2233;--ink2:#4a5268;--muted:#8a8f9e;
  --line:#e4ddd2;--accent:#e2553f;--accent-soft:#fbe3dd;--teal:#1d8a7a;--teal-soft:#d9f0eb;
  --gold:#c98b12;--gold-soft:#f7ead0;--violet:#5b4fc4;--violet-soft:#e6e3fa;--bad:#c63a3a;--good:#1d8a5a;
  --radius:16px;--shadow:0 1px 2px rgba(28,34,51,.06),0 6px 24px rgba(28,34,51,.06);
  --font:"Manrope",system-ui,sans-serif;--display:"Unbounded","Manrope",sans-serif;
}
[data-theme=dark]{
  --bg:#12151e;--surface:#1a1e2a;--surface2:#232838;--ink:#eef0f5;--ink2:#b7bccb;--muted:#7d8397;
  --line:#2c3244;--accent:#ff7a63;--accent-soft:#3a2420;--teal:#3cc2ac;--teal-soft:#183530;
  --gold:#e8b44a;--gold-soft:#3a3020;--violet:#9a90ff;--violet-soft:#27254a;--bad:#ff6b6b;--good:#4bd08f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--ink);color:var(--bg)}
.nav .ic{width:20px;text-align:center;opacity:.9}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.main{min-width:0;padding:28px clamp(16px,4vw,48px) 80px;max-width:1180px}
.topbar{display:none}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.2;margin:0 0 .5em}
h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}
p{margin:0 0 .8em}
.sub{color:var(--ink2);margin-top:-4px}
.muted{color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.link{cursor:pointer;transition:transform .15s,border-color .15s}
.card.link:hover{transform:translateY(-2px);border-color:var(--ink2)}
.card h3{margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;transition:all .12s}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;font-size:14px;padding:0}
.icon-btn:hover{border-color:var(--teal);color:var(--teal)}
.icon-btn.speaking{background:var(--teal);color:#fff;border-color:var(--teal)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--ink2)}
.lv{font-family:var(--display);font-size:11px;padding:3px 8px;border-radius:7px;font-weight:700;color:#fff}
.lv-A1{background:#3a9d6e}.lv-A2{background:#2a8a9e}.lv-B1{background:#4f6fd1}.lv-B2{background:#7a52c7}.lv-C1{background:#c2477d}.lv-C2{background:#c9552f}
input[type=text],input[type=search],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
textarea{min-height:140px;resize:vertical;line-height:1.6}
label.f{display:block;font-weight:700;font-size:13px;margin-bottom:4px;color:var(--ink2)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}
.hero{background:var(--ink);color:var(--bg);border-radius:22px;padding:26px;position:relative;overflow:hidden}
.hero h1{color:var(--bg)}
.hero .sub{color:rgba(255,255,255,.7)}
[data-theme=dark] .hero{background:linear-gradient(135deg,#2a2f45,#1f2433);color:var(--ink)}
[data-theme=dark] .hero h1{color:var(--ink)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--accent);opacity:.25}
.stat{font-family:var(--display);font-size:26px;font-weight:700}
.stat-l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tab{padding:7px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:13px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.formula{font-family:ui-monospace,Menlo,monospace;background:var(--violet-soft);color:var(--violet);padding:10px 14px;border-radius:10px;font-weight:600;margin:6px 0}
.ex{border-left:3px solid var(--teal);padding:4px 12px;margin:6px 0}
.ex .ru{color:var(--muted);font-size:13.5px}
.warn{background:var(--gold-soft);border-radius:12px;padding:12px 14px}
.note{background:var(--teal-soft);border-radius:12px;padding:12px 14px}
.err{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;font-weight:600;margin:6px 0}
.opt:hover{border-color:var(--ink2)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.fb-ok{color:var(--good);font-weight:700}.fb-no{color:var(--bad);font-weight:700}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.flash .w{font-family:var(--display);font-size:34px;font-weight:700}
.ipa{font-family:"Noto Sans",system-ui,sans-serif;color:var(--violet)}
.rupr{color:var(--accent);font-weight:700}
.wcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.wcard:hover{border-color:var(--ink2)}
.wcard b{font-size:16px}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;z-index:50;overflow-y:auto;animation:fade .15s}
.modal{background:var(--surface);border-radius:20px;max-width:720px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
.modal .x{position:absolute;right:14px;top:14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view{animation:up .25s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:99;animation:up .2s}
.reading-text{font-size:17px;line-height:1.85}
.reading-text .tw{cursor:pointer;border-radius:4px}
.reading-text .tw:hover{background:var(--gold-soft)}
.reading-text .hl{background:var(--gold-soft)}
.pop{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;max-width:300px;font-size:14px}
.diff del{color:var(--bad);text-decoration:line-through}
.diff ins{color:var(--good);text-decoration:none;font-weight:700}
.timer{font-family:var(--display);font-weight:700;font-size:18px;padding:4px 12px;border-radius:10px;background:var(--surface2)}
.timer.low{background:var(--accent);color:#fff}
.ctest input{width:auto;display:inline-block;padding:2px 4px;border-radius:6px;font-family:ui-monospace,monospace;font-size:15px;border:1px solid var(--line);min-width:2ch}
.ctest{line-height:2.3;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600}
.chip.on{border-color:var(--teal);background:var(--teal-soft)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg)}
.msg.bot{align-self:flex-start;background:var(--surface2)}
.msg .corr{margin-top:6px;font-size:13px;background:var(--gold-soft);color:var(--ink);padding:6px 9px;border-radius:9px}
.heat{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface2)}
.photo{width:100%;max-width:460px;border-radius:14px;border:1px solid var(--line);display:block}
.kbd{font-family:ui-monospace,monospace;background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:12px}
.mic.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grades .btn{justify-content:center}
.quick{grid-template-columns:repeat(3,1fr)}
.hide{display:none!important}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line)}
  .main{padding:18px 14px 80px}
  h1{font-size:23px}
  .flash .w{font-size:28px}
  .grades{grid-template-columns:1fr 1fr}
  .hero{padding:20px}
  .modal{padding:20px 16px}
  .row>select,.row>input{max-width:100%}
  table.t{font-size:13px}
}

</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">St</span><div>Stepwise English<small>A1 → C2 · Duolingo English Test</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div>
    <div class="topbar"><button class="icon-btn" id="menuBtn" aria-label="Меню">☰</button><b style="font-family:var(--display)">Stepwise English</b></div>
    <main class="main" id="view"></main>
  </div>
</div>
<script>
const VOCAB_RAW = {};
// Формат строки: word|pos|перевод|IPA (UK)|русская подсказка|пример|перевод примера|тема|доп. (f:формы;s:синонимы;a:антонимы;c:сочетания;m:типичная ошибка)
VOCAB_RAW.A1 = `
hello|int|привет, здравствуйте|həˈləʊ|хэло́у|Hello, my name is Anna.|Здравствуйте, меня зовут Анна.|greet|s:hi;c:say hello
goodbye|int|до свидания|ˌɡʊdˈbaɪ|гудба́й|Goodbye, see you tomorrow!|До свидания, увидимся завтра!|greet|s:bye
please|adv|пожалуйста (просьба)|pliːz|пли:з|Can I have some water, please?|Можно мне воды, пожалуйста?|greet|m:В ответ на «спасибо» говорят не please, а You're welcome.
thank you|phr|спасибо|ˈθæŋk juː|сэ́нк ю: (θ — язык между зубами)|Thank you for your help.|Спасибо за помощь.|greet|s:thanks;c:thank you very much
sorry|adj|извините, жаль|ˈsɒri|со́ри|Sorry, I'm late.|Извините, я опоздал.|greet|c:I'm sorry;m:Чтобы привлечь внимание, лучше Excuse me, а не Sorry.
name|n|имя|neɪm|нэйм|What's your name?|Как тебя зовут?|greet|c:first name, surname
friend|n|друг, подруга|frend|фрэнд|She is my best friend.|Она моя лучшая подруга.|family|c:best friend, make friends
mother|n|мама, мать|ˈmʌðə|ма́зэ (ð — звонкий межзубный)|My mother is a doctor.|Моя мама — врач.|family|s:mum (UK), mom (US)
father|n|папа, отец|ˈfɑːðə|фа́:зэ|My father works in a bank.|Мой папа работает в банке.|family|s:dad
brother|n|брат|ˈbrʌðə|бра́зэ|I have one brother.|У меня один брат.|family
sister|n|сестра|ˈsɪstə|си́стэ|My sister is ten.|Моей сестре десять лет.|family
son|n|сын|sʌn|сан|Their son is a student.|Их сын — студент.|family
daughter|n|дочь|ˈdɔːtə|до́:тэ|They have a daughter.|У них есть дочь.|family|m:gh не читается
husband|n|муж|ˈhʌzbənd|ха́збэнд|Her husband is from Spain.|Её муж из Испании.|family
wife|n|жена|waɪf|вайф (w — губы трубочкой)|His wife is a teacher.|Его жена — учительница.|family|f:wives
child|n|ребёнок|tʃaɪld|чайлд|The child is sleeping.|Ребёнок спит.|family|f:children
baby|n|младенец|ˈbeɪbi|бэ́йби|The baby is crying.|Малыш плачет.|family
parents|n|родители|ˈpeərənts|пэ́эрэнтс|My parents live in Almaty.|Мои родители живут в Алматы.|family|m:parents — только родители, а не все родственники (relatives)
apple|n|яблоко|ˈæpl|э́пл (æ — широкое «э»)|I eat an apple every day.|Я ем яблоко каждый день.|food|c:apple juice
bread|n|хлеб|bred|брэд|We need some bread.|Нам нужен хлеб.|food|m:Неисчисляемое: some bread, a loaf of bread
water|n|вода|ˈwɔːtə|уо́:тэ|Can I have a glass of water?|Можно стакан воды?|food|m:Неисчисляемое: не «a water», а a glass of water
milk|n|молоко|mɪlk|милк|I drink milk in the morning.|Я пью молоко утром.|food
coffee|n|кофе|ˈkɒfi|ко́фи|Would you like some coffee?|Хотите кофе?|food
tea|n|чай|tiː|ти:|I drink tea with lemon.|Я пью чай с лимоном.|food
egg|n|яйцо|eɡ|эг|I have two eggs for breakfast.|На завтрак я ем два яйца.|food
cheese|n|сыр|tʃiːz|чи:з|This cheese is very good.|Этот сыр очень вкусный.|food
meat|n|мясо|miːt|ми:т|I don't eat meat.|Я не ем мясо.|food
fish|n|рыба|fɪʃ|фиш|We have fish for dinner.|На ужин у нас рыба.|food
rice|n|рис|raɪs|райс|Rice is popular in Asia.|Рис популярен в Азии.|food
breakfast|n|завтрак|ˈbrekfəst|брэ́кфэст|I have breakfast at 8.|Я завтракаю в 8.|food|c:have breakfast;m:Без артикля: have breakfast, не have a breakfast
lunch|n|обед|lʌntʃ|ланч|Let's have lunch together.|Давай пообедаем вместе.|food
dinner|n|ужин|ˈdɪnə|ди́нэ|Dinner is ready!|Ужин готов!|food
eat|v|есть, кушать|iːt|и:т|What do you eat for lunch?|Что ты ешь на обед?|food|f:ate, eaten
drink|v|пить|drɪŋk|дринк|I drink a lot of water.|Я пью много воды.|food|f:drank, drunk
house|n|дом (здание)|haʊs|ха́ус|They live in a big house.|Они живут в большом доме.|home|m:house — здание, home — «дом» как место, где живёшь
home|n|дом (родной)|həʊm|хо́ум|I go home at six.|Я иду домой в шесть.|home|m:go home — без предлога to
room|n|комната|ruːm|ру:м|My room is small.|Моя комната маленькая.|home
kitchen|n|кухня|ˈkɪtʃɪn|ки́чин|Mum is in the kitchen.|Мама на кухне.|home
bedroom|n|спальня|ˈbedruːm|бэ́друм|The bedroom is upstairs.|Спальня наверху.|home
table|n|стол|ˈteɪbl|тэ́йбл|The keys are on the table.|Ключи на столе.|home
chair|n|стул|tʃeə|чэ́э|Sit on this chair.|Садись на этот стул.|home
bed|n|кровать|bed|бэд|I go to bed at eleven.|Я ложусь спать в одиннадцать.|home|c:go to bed, make the bed
door|n|дверь|dɔː|до:|Please close the door.|Закрой, пожалуйста, дверь.|home
window|n|окно|ˈwɪndəʊ|уи́ндоу|Open the window, please.|Открой окно, пожалуйста.|home
shirt|n|рубашка|ʃɜːt|шё:т|He is wearing a white shirt.|На нём белая рубашка.|clothes
dress|n|платье|dres|дрэс|What a beautiful dress!|Какое красивое платье!|clothes
shoes|n|обувь, туфли|ʃuːz|шу:з|These shoes are new.|Эти туфли новые.|clothes
jacket|n|куртка, пиджак|ˈdʒækɪt|джэ́кит|Take your jacket, it's cold.|Возьми куртку, холодно.|clothes
trousers|n|брюки|ˈtraʊzəz|тра́узэз|My trousers are black.|Мои брюки чёрные.|clothes|s:pants (US);m:Всегда мн. число: my trousers are
hat|n|шляпа, шапка|hæt|хэт|Put on your hat.|Надень шапку.|clothes
wear|v|носить (одежду)|weə|уэ́э|I wear glasses.|Я ношу очки.|clothes|f:wore, worn;m:wear — носить на себе, carry — нести в руках
wake up|phr|просыпаться|weɪk ʌp|уэйк ап|I wake up at seven.|Я просыпаюсь в семь.|routine|f:woke up, woken up
get up|phr|вставать|ɡet ʌp|гэт ап|I get up early.|Я встаю рано.|routine
work|v|работать|wɜːk|уё:к|She works in an office.|Она работает в офисе.|routine|m:work — также «работа» (неисчисляемое): I have a lot of work
sleep|v|спать|sliːp|сли:п|Babies sleep a lot.|Младенцы много спят.|routine|f:slept, slept

explain:"<p><b>Present Simple</b> — настоящее простое время. Используется для <b>регулярных действий</b>, привычек, фактов и расписаний: <i>I drink coffee every morning</i>.</p><p>Главная особенность: с <b>he, she, it</b> к глаголу добавляется окончание <b>-s/-es</b>. Для вопросов и отрицаний нужен вспомогательный глагол <b>do / does</b>.</p>",
formulas:["+ I / you / we / they + V; he / she / it + V-s","− Подлежащее + don't / doesn't + V","? Do / Does + подлежащее + V?"],
aff:[["I work in a bank.","Я работаю в банке."],["She lives in Astana.","Она живёт в Астане."],["Water boils at 100°C.","Вода кипит при 100 °C."]],
neg:[["I don't like coffee.","Я не люблю кофе."],["He doesn't speak French.","Он не говорит по-французски."]],
q:[["Do you play tennis? — Yes, I do.","Ты играешь в теннис? — Да."],["Does she work here? — No, she doesn't.","Она здесь работает? — Нет."],["What time does the train leave?","Во сколько уходит поезд?"]],
table:"<table class='t'><tr><th>Окончание</th><th>Когда</th><th>Пример</th></tr><tr><td>-s</td><td>большинство глаголов</td><td>works, plays</td></tr><tr><td>-es</td><td>после -s, -sh, -ch, -x, -o</td><td>watches, goes, fixes</td></tr><tr><td>-ies</td><td>согласная + y</td><td>study → studies</td></tr></table><p class='muted'>Маркеры: always, usually, often, sometimes, never, every day, on Mondays.</p>",
exceptions:"<p><b>have → has</b> с he/she/it. После <b>does / doesn't</b> окончание -s <b>не ставится</b>: <i>Does he work?</i> (не «Does he works?»).</p>",
mistakes:["«He work» — потеряно -s: <b>He works</b>.","«Does she likes…?» — после does глагол без -s: <b>Does she like…?</b>","«I am work every day» — нельзя смешивать am и простой глагол: <b>I work every day</b>.","«He don't…» — с he/she/it: <b>doesn't</b>."],
ex:[{q:"She ___ (watch) TV every evening.",a:["watches"],e:"После -ch добавляем -es."},{q:"My parents ___ in a village.",o:["lives","live","living"],a:1,e:"parents = they → live."},{q:"___ he speak English?",o:["Do","Does","Is"],a:1,e:"he → Does."},{q:"I ___ eat meat.",o:["don't","doesn't","not"],a:0,e:"I → don't."},{q:"He ___ (study) at university.",a:["studies"],e:"Согласная + y → -ies."},{q:"Tom ___ (have) two cats.",a:["has"],e:"have → has с he/she/it."}],
quiz:[{q:"Выберите правильное:",o:["Does she works here?","Does she work here?","Do she work here?"],a:1,e:"Does + V без -s."},{q:"The shop ___ at 9 a.m.",o:["open","opens","is open at"],a:1,e:"Расписание, it → opens."},{q:"Where ___ you live?",o:["do","does","are"],a:0,e:"you → do."}],
summary:"Регулярные действия и факты. He/she/it + V-s. Вопросы и отрицания через do/does — тогда основной глагол без -s."},

"present-continuous":{level:"A1",title:"Present Continuous",
explain:"<p><b>Present Continuous</b> описывает действие, которое происходит <b>прямо сейчас</b> или в текущий период, а также запланированное будущее: <i>I'm meeting Tom tomorrow</i>.</p><p>Образуется из <b>am / is / are</b> и глагола с окончанием <b>-ing</b>.</p>",
formulas:["+ Подлежащее + am / is / are + V-ing","− Подлежащее + am / is / are + not + V-ing","? Am / Is / Are + подлежащее + V-ing?"],
aff:[["I'm reading a book now.","Сейчас я читаю книгу."],["They are playing football.","Они играют в футбол."]],
neg:[["She isn't working today.","Сегодня она не работает."],["We aren't watching TV.","Мы не смотрим телевизор."]],
q:[["What are you doing?","Что ты делаешь?"],["Is it raining?","Идёт дождь?"]],
table:"<table class='t'><tr><th>Правило -ing</th><th>Пример</th></tr><tr><td>обычно + ing</td><td>read → reading</td></tr><tr><td>немое -e убираем</td><td>write → writing</td></tr><tr><td>краткий ударный слог: удваиваем согласную</td><td>run → running, sit → sitting</td></tr><tr><td>-ie → -ying</td><td>lie → lying</td></tr></table>",
exceptions:"<p><b>Глаголы состояния</b> (know, like, love, want, need, understand, believe, own) обычно <b>не</b> используются в Continuous: <i>I know</i>, а не «I'm knowing».</p>",
mistakes:["«I reading» — пропущен am: <b>I'm reading</b>.","«I'm knowing the answer» — know не используется в Continuous: <b>I know</b>.","«She is work now» — нужен -ing: <b>She is working</b>."],
ex:[{q:"Look! It ___ (snow).",a:["is snowing","'s snowing"],e:"Действие сейчас: is + snowing."},{q:"I ___ to music right now.",o:["listen","am listening","listens"],a:1,e:"right now → Present Continuous."},{q:"They ___ dinner at the moment.",o:["are having","have","is having"],a:0,e:"they → are + having."},{q:"Напишите -ing форму: swim → ___",a:["swimming"],e:"Удваиваем m."},{q:"I ___ the answer.",o:["am knowing","know"],a:1,e:"know — глагол состояния."}],
quiz:[{q:"What ___ you doing?",o:["do","are","is"],a:1,e:"you → are."},{q:"She ___ now. Don't call her.",o:["sleeps","is sleeping","sleep"],a:1,e:"now → Continuous."},{q:"Выберите верное:",o:["I'm wanting tea.","I want tea."],a:1,e:"want — глагол состояния."}],
summary:"am/is/are + V-ing — действие в процессе сейчас. Глаголы состояния в Continuous не ставятся."},

"there-is":{level:"A1",title:"There is / There are",
explain:"<p>Конструкция <b>there is / there are</b> сообщает, что что-то <b>существует или находится</b> где-то: «Есть, имеется, находится». Русское «В комнате есть стол» = <i>There is a table in the room</i>.</p><p><b>There is</b> — с единственным числом и неисчисляемыми, <b>there are</b> — с множественным.</p>",
formulas:["There is (There's) + a/an + сущ. ед. ч. + место","There are + some / числительное + сущ. мн. ч. + место"],
aff:[["There is a park near my house.","Рядом с моим домом есть парк."],["There are two bedrooms in the flat.","В квартире две спальни."],["There is some milk in the fridge.","В холодильнике есть молоко."]],
neg:[["There isn't a lift.","Лифта нет."],["There aren't any shops here.","Здесь нет магазинов."]],
q:[["Is there a bank near here?","Здесь рядом есть банк?"],["Are there any questions?","Есть вопросы?"],["How many people are there?","Сколько там людей?"]],
exceptions:"<p>При перечислении глагол согласуется с <b>первым</b> предметом: <i>There <b>is</b> a sofa and two chairs</i>.</p>",
mistakes:["«In the room is a table» — по-английски: <b>There is a table in the room</b>.","«There are a cat» — с ед. числом <b>there is</b>.","«There have…» — нельзя, только <b>there is/are</b>."],
ex:[{q:"There ___ three cafés on this street.",o:["is","are"],a:1,e:"three cafés — мн. число."},{q:"There ___ some water in the bottle.",o:["is","are"],a:0,e:"water — неисчисляемое."},{q:"___ there a hospital in your town?",o:["Is","Are","Do"],a:0,e:"a hospital → Is there."},{q:"There aren't ___ eggs.",o:["some","any","a"],a:1,e:"В отрицании — any."},{q:"Переведите: На столе есть книга.",a:["there is a book on the table","there's a book on the table"],e:"There is + a book + on the table."}],
quiz:[{q:"There ___ a lot of people at the party.",o:["was","were","is"],a:1,e:"people — мн. число; прошедшее — were."},{q:"There ___ a bed and two chairs.",o:["is","are"],a:0,e:"Согласуем с первым: a bed."},{q:"Выберите верное:",o:["Is there any milk?","Are there any milk?"],a:0,e:"milk — неисчисляемое."}],
summary:"There is + ед. ч./неисчисляемое, There are + мн. ч. Место — в конце предложения."},

"can":{level:"A1",title:"Can / Can't",
explain:"<p><b>Can</b> — модальный глагол: «могу, умею, можно». Выражает умение, возможность и разрешение. После can глагол идёт <b>без to</b> и <b>без -s</b>, а сам can не меняется по лицам.</p>",
formulas:["Подлежащее + can / can't (cannot) + V","Can + подлежащее + V?"],
aff:[["I can swim.","Я умею плавать."],["She can speak three languages.","Она говорит на трёх языках."]],
neg:[["I can't drive.","Я не умею водить."],["You can't park here.","Здесь нельзя парковаться."]],
q:[["Can you help me?","Можешь помочь?"],["Can I sit here?","Можно здесь сесть?"]],
exceptions:"<p>Произношение: <b>can</b> /kən/ (безударно) и <b>can't</b> /kɑːnt/ (UK) или /kænt/ (US). Различайте по долгому гласному и ударению.</p><p>В прошедшем — <b>could</b>; в других временах — <b>be able to</b>: <i>I will be able to come</i>.</p>",
mistakes:["«She cans» — can не меняется: <b>she can</b>.","«I can to swim» — без to: <b>I can swim</b>.","«Do you can…?» — <b>Can you…?</b>"],
ex:[{q:"He ___ play the guitar.",o:["can","cans","can to"],a:0,e:"can не меняется и без to."},{q:"___ you speak Spanish?",o:["Do","Can","Are"],a:1,e:"Вопрос: Can you…?"},{q:"I can't ___ this word.",o:["to read","read","reading"],a:1,e:"После can — инфинитив без to."},{q:"Переведите: Я умею готовить.",a:["i can cook"],e:"I can cook."}],
quiz:[{q:"Выберите верное:",o:["She can sings.","She can sing.","She cans sing."],a:1,e:"can + V."},{q:"«Можно мне войти?»",o:["Can I come in?","Do I can come in?"],a:0,e:"Can I…?"},{q:"Прошедшее от can:",o:["canned","could","can't"],a:1,e:"could."}],
summary:"can + глагол без to. Одна форма для всех лиц. Отрицание — can't, вопрос — Can you…?"},

"plural":{level:"A1",title:"Единственное и множественное число",
explain:"<p>Большинство существительных образуют множественное число окончанием <b>-s</b>: <i>book → books</i>. Но есть правила написания и исключения, которые нужно запомнить.</p>",
formulas:["сущ. + s: cat → cats","-s, -sh, -ch, -x, -o + es: box → boxes, potato → potatoes","согласная + y → -ies: city → cities","-f / -fe → -ves: knife → knives"],
aff:[["I have two brothers.","У меня два брата."],["These boxes are heavy.","Эти коробки тяжёлые."]],
neg:[["There aren't many children here.","Здесь мало детей."]],
q:[["How many people are there?","Сколько там людей?"]],
table:"<table class='t'><tr><th>Ед. ч.</th><th>Мн. ч.</th></tr><tr><td>man</td><td>men</td></tr><tr><td>woman</td><td>women /ˈwɪmɪn/</td></tr><tr><td>child</td><td>children</td></tr><tr><td>person</td><td>people</td></tr><tr><td>foot</td><td>feet</td></tr><tr><td>tooth</td><td>teeth</td></tr><tr><td>mouse</td><td>mice</td></tr><tr><td>sheep, fish</td><td>sheep, fish</td></tr></table>",
exceptions:"<p>Только мн. число: <i>trousers, glasses, scissors, jeans</i>. Неисчисляемые не имеют мн. числа: <i>information, advice, news, furniture</i>.</p>",
mistakes:["«informations», «advices» — неисчисляемые, -s нельзя.","«childs», «mans» — исключения: <b>children, men</b>.","«peoples» в значении «люди» — правильно <b>people</b>."],
ex:[{q:"Множественное: baby → ___",a:["babies"],e:"согласная + y → ies."},{q:"Множественное: knife → ___",a:["knives"],e:"-fe → -ves."},{q:"Множественное: child → ___",a:["children"],e:"Исключение."},{q:"Множественное: tooth → ___",a:["teeth"],e:"Исключение."},{q:"Can you give me some ___?",o:["advices","advice"],a:1,e:"advice — неисчисляемое."}],
quiz:[{q:"Множественное от person:",o:["persons","people","peoples"],a:1,e:"people."},{q:"Множественное от bus:",o:["buss","buses","busies"],a:1,e:"-s → -es."},{q:"Выберите верное:",o:["The news is good.","The news are good."],a:0,e:"news — неисчисляемое, ед. ч."}],
summary:"Обычно +s; после шипящих +es; y → ies; f → ves. Учите исключения: men, women, children, people, feet, teeth."},

"past-simple":{level:"A2",title:"Past Simple",
explain:"<p><b>Past Simple</b> — простое прошедшее время. Описывает <b>завершённые действия в прошлом</b>, особенно когда указано время: <i>yesterday, last week, in 2010, two days ago</i>.</p><p>Правильные глаголы получают окончание <b>-ed</b>, неправильные имеют особую форму (2-я форма в таблице). В вопросах и отрицаниях используется <b>did</b>, а основной глагол возвращается в начальную форму.</p>",
formulas:["+ Подлежащее + V-ed / V2","− Подлежащее + didn't + V","? Did + подлежащее + V?"],
aff:[["I watched a film yesterday.","Вчера я посмотрел фильм."],["We went to Turkey last summer.","Прошлым летом мы ездили в Турцию."]],
neg:[["She didn't call me.","Она мне не позвонила."],["I didn't see him.","Я его не видел."]],
q:[["Did you sleep well?","Ты хорошо спал?"],["Where did you go?","Куда ты ходил?"]],
table:"<table class='t'><tr><th>V1</th><th>V2 (Past)</th><th>Перевод</th></tr><tr><td>go</td><td>went</td><td>идти</td></tr><tr><td>see</td><td>saw</td><td>видеть</td></tr><tr><td>buy</td><td>bought</td><td>покупать</td></tr><tr><td>take</td><td>took</td><td>брать</td></tr><tr><td>make</td><td>made</td><td>делать</td></tr><tr><td>write</td><td>wrote</td><td>писать</td></tr><tr><td>be</td><td>was / were</td><td>быть</td></tr></table><p class='muted'>Окончание -ed читается /t/ после глухих (worked), /d/ после звонких (played), /ɪd/ после t, d (wanted).</p>",
exceptions:"<p>Глагол <b>be</b> образует вопросы и отрицания без did: <i>Were you at home? I wasn't tired.</i></p>",
mistakes:["«Did you went?» — после did начальная форма: <b>Did you go?</b>","«I didn't saw» — <b>I didn't see</b>.","«Yesterday I go» — нужно прошедшее: <b>Yesterday I went</b>.","«I was go» — нельзя смешивать was и глагол: <b>I went</b>."],
ex:[{q:"I ___ (visit) my grandma last weekend.",a:["visited"],e:"Правильный глагол + ed."},{q:"She ___ (buy) a new dress.",a:["bought"],e:"buy — bought."},{q:"___ you see the match?",o:["Do","Did","Were"],a:1,e:"Прошлое → Did."},{q:"We didn't ___ anything.",o:["ate","eat","eaten"],a:1,e:"После didn't — начальная форма."},{q:"They ___ at the cinema yesterday.",o:["was","were","did"],a:1,e:"they → were."},{q:"He ___ (write) a letter.",a:["wrote"],e:"write — wrote."}],
quiz:[{q:"Выберите верное:",o:["Did she called?","Did she call?","Does she called?"],a:1,e:"Did + V."},{q:"Прошедшее от take:",o:["taked","took","taken"],a:1,e:"took."},{q:"I ___ him two days ago.",o:["have seen","saw","see"],a:1,e:"ago → Past Simple."}],
summary:"Завершённое действие в прошлом. V-ed или V2; вопросы и отрицания — did + V."},

"going-to":{level:"A2",title:"Be going to",
explain:"<p><b>Be going to</b> выражает <b>намерения и планы</b>, о которых решили заранее, а также <b>прогнозы на основе того, что мы видим</b> сейчас: <i>Look at the clouds — it's going to rain</i>.</p><p>Сравните с <b>will</b>: will — решение, принятое в момент речи, или общее предсказание.</p>",
formulas:["Подлежащее + am / is / are + going to + V"],
aff:[["I'm going to study medicine.","Я собираюсь изучать медицину."],["Be careful! You're going to fall.","Осторожно! Ты сейчас упадёшь."]],
neg:[["We aren't going to buy a car.","Мы не собираемся покупать машину."]],
q:[["What are you going to do tonight?","Что ты собираешься делать вечером?"]],
table:"<table class='t'><tr><th>will</th><th>be going to</th></tr><tr><td>Спонтанное решение: <i>I'll get it!</i></td><td>Заранее обдуманный план: <i>I'm going to paint the room.</i></td></tr><tr><td>Мнение о будущем: <i>I think he'll win.</i></td><td>Прогноз по признакам: <i>He's going to win — he's far ahead.</i></td></tr></table>",
exceptions:"<p>В разговоре часто звучит <b>gonna</b> (<i>I'm gonna…</i>) — это неформальное произношение, в письменной речи его не используют.</p>",
mistakes:["«I going to…» — пропущен am: <b>I'm going to</b>.","«She is going to goes» — после to глагол без -s: <b>going to go</b>."],
ex:[{q:"I ___ visit my parents next weekend.",o:["am going to","going to","will to"],a:0,e:"План → am going to."},{q:"Look at the sky! It ___ rain.",o:["will","is going to"],a:1,e:"Прогноз по признакам."},{q:"The phone is ringing. — I ___ answer it.",o:["'ll","'m going to"],a:0,e:"Спонтанное решение → will."},{q:"They ___ going to move to Almaty.",o:["is","are","am"],a:1,e:"they → are."}],
quiz:[{q:"Выберите верное:",o:["She going to study.","She is going to study.","She is going study."],a:1,e:"is going to + V."},{q:"Спонтанное решение:",o:["I'm going to help you!","I'll help you!"],a:1,e:"will."},{q:"What ___ you going to do?",o:["do","are","will"],a:1,e:"you → are: What are you going to do?"}],
summary:"am/is/are going to + V — планы и прогнозы по признакам. Will — спонтанные решения и мнения."},

"comparatives":{level:"A2",title:"Comparative and Superlative Adjectives",
explain:"<p><b>Сравнительная степень</b> (comparative) сравнивает два предмета: <i>bigger than</i>. <b>Превосходная</b> (superlative) выделяет один из группы: <i>the biggest</i>.</p><p>Короткие прилагательные (1 слог) получают <b>-er / -est</b>, длинные (от 2–3 слогов) — <b>more / most</b>.</p>",
formulas:["короткое: adj-er + than / the adj-est","длинное: more + adj + than / the most + adj","2 слога на -y: happy → happier → the happiest"],
aff:[["My brother is taller than me.","Мой брат выше меня."],["This is the most interesting book.","Это самая интересная книга."]],
neg:[["It isn't as cold as yesterday.","Не так холодно, как вчера."]],
q:[["Which is the longest river in the world?","Какая река самая длинная в мире?"]],
table:"<table class='t'><tr><th>Прил.</th><th>Comparative</th><th>Superlative</th></tr><tr><td>good</td><td>better</td><td>the best</td></tr><tr><td>bad</td><td>worse</td><td>the worst</td></tr><tr><td>far</td><td>further / farther</td><td>the furthest</td></tr><tr><td>big</td><td>bigger</td><td>the biggest</td></tr><tr><td>beautiful</td><td>more beautiful</td><td>the most beautiful</td></tr></table>",
exceptions:"<p>Удвоение согласной: <i>hot → hotter, big → bigger</i>. Равенство: <b>as … as</b> — <i>as tall as</i>.</p>",
mistakes:["«more better» — двойное сравнение: <b>better</b>.","«taller then me» — <b>than</b>, а не then.","«the most big» — короткое: <b>the biggest</b>.","«She is more tall» — <b>taller</b>."],
ex:[{q:"Russia is ___ (big) than France.",a:["bigger"],e:"Удваиваем g + er."},{q:"This is the ___ (good) day of my life.",a:["best"],e:"good → best."},{q:"English is ___ than Chinese.",o:["easyer","easier","more easy"],a:1,e:"y → ier."},{q:"It's the ___ expensive hotel in the city.",o:["most","more","much"],a:0,e:"the most + длинное прил."},{q:"My exam was ___ than yours.",o:["worse","badder","more bad"],a:0,e:"bad → worse."}],
quiz:[{q:"Выберите верное:",o:["She is more taller.","She is taller.","She is the more tall."],a:1,e:"taller."},{q:"This film is ___ interesting than that one.",o:["more","most","-er"],a:0,e:"more + interesting + than."},{q:"Mount Everest is ___ mountain in the world.",o:["the highest","higher","the most high"],a:0,e:"the highest."}],
summary:"Короткие: -er/-est; длинные: more/most. Исключения: good–better–best, bad–worse–worst."},

"first-cond":{level:"A2",title:"First Conditional",
explain:"<p><b>First Conditional</b> — реальное условие в будущем: если что-то произойдёт, то будет результат. <i>If it rains, we will stay at home.</i></p><p>Ключевое правило: в части с <b>if</b> используется <b>Present Simple</b>, хотя по смыслу это будущее. Русскоязычные часто ставят will после if — это ошибка.</p>",
formulas:["If + Present Simple, will + V","will + V + if + Present Simple"],
aff:[["If you study, you will pass the exam.","Если будешь заниматься, сдашь экзамен."],["I'll call you if I'm late.","Я позвоню, если опоздаю."]],
neg:[["If you don't hurry, you'll miss the bus.","Если не поторопишься, опоздаешь на автобус."]],
q:[["What will you do if it rains?","Что ты будешь делать, если пойдёт дождь?"]],
exceptions:"<p>Вместо will можно использовать <b>can, may, might, should</b> и повелительное наклонение: <i>If you see him, tell him to call me.</i> <b>Unless</b> = if not: <i>Unless you hurry, you'll be late.</i></p>",
mistakes:["«If it will rain…» — после if Present Simple: <b>If it rains</b>.","«If you will come, I will…» — <b>If you come, I'll…</b>"],
ex:[{q:"If it ___ (be) sunny tomorrow, we'll go to the beach.",a:["is"],e:"После if — Present Simple."},{q:"If we ___ now, we'll catch the train.",o:["will leave","leave","left"],a:1,e:"После if — Present Simple: leave."},{q:"I ___ you if I have time.",o:["help","will help","helped"],a:1,e:"Результат → will help."},{q:"If she ___ the bus, she'll be late.",o:["will miss","misses","missed"],a:1,e:"if + Present Simple."},{q:"___ you hurry, you'll miss the train.",o:["If","Unless","When"],a:1,e:"Unless = if not."}],
quiz:[{q:"Выберите верное:",o:["If I will see him, I'll tell him.","If I see him, I'll tell him."],a:1,e:"После if — без will."},{q:"If you ___ hungry, eat something.",o:["are","will be"],a:0,e:"if + Present Simple."},{q:"Тип условия «если пойдёт дождь, мы останемся дома»:",o:["Zero","First","Second"],a:1,e:"Реальное будущее — First."}],
summary:"If + Present Simple, will + V. Никакого will после if!"},

"pp-intro":{level:"A2",title:"Present Perfect (введение)",
explain:"<p><b>Present Perfect</b> связывает прошлое с настоящим: важен <b>результат</b> или <b>опыт</b>, а не точное время. <i>I have lost my keys</i> — «Я потерял ключи (и сейчас их нет)».</p><p>Образуется из <b>have / has</b> и <b>третьей формы глагола</b> (V3 / past participle).</p>",
formulas:["+ Подлежащее + have / has + V3","− Подлежащее + haven't / hasn't + V3","? Have / Has + подлежащее + V3?"],
aff:[["I have been to London.","Я бывал в Лондоне."],["She has finished her work.","Она закончила работу."]],
neg:[["I haven't seen this film.","Я не видел этот фильм."]],
q:[["Have you ever eaten sushi?","Ты когда-нибудь ел суши?"]],
table:"<table class='t'><tr><th>V1</th><th>V3</th></tr><tr><td>be</td><td>been</td></tr><tr><td>do</td><td>done</td></tr><tr><td>see</td><td>seen</td></tr><tr><td>eat</td><td>eaten</td></tr><tr><td>work</td><td>worked</td></tr></table><p class='muted'>Маркеры: ever, never, already, yet, just.</p>",
exceptions:"<p>С точным временем в прошлом (yesterday, in 2019, ago) Present Perfect <b>не используется</b> — нужен Past Simple.</p>",
mistakes:["«I have seen him yesterday» — с yesterday Past Simple: <b>I saw him yesterday</b>.","«She have done» — с she: <b>has</b>."],
ex:[{q:"I have never ___ (be) to Japan.",a:["been"],e:"have + V3: been."},{q:"She ___ just finished.",o:["have","has","is"],a:1,e:"she → has."},{q:"Have you ever ___ a horse?",o:["ride","rode","ridden"],a:2,e:"V3 — ridden."},{q:"I ___ him last week.",o:["have met","met"],a:1,e:"last week → Past Simple."}],
quiz:[{q:"Выберите верное:",o:["I have finished it yesterday.","I finished it yesterday."],a:1,e:"yesterday → Past Simple."},{q:"Have you ___ your homework yet?",o:["did","done","do"],a:1,e:"V3 — done."},{q:"Опыт в жизни:",o:["I was to Paris.","I have been to Paris."],a:1,e:"Опыт → Present Perfect."}],
summary:"have/has + V3 — результат и опыт без точного времени. С yesterday/ago — Past Simple."},

"present-perfect":{level:"B1",title:"Present Perfect",
explain:"<p>На уровне B1 Present Perfect используется в трёх основных значениях:</p><ol><li><b>Опыт</b>: <i>I've never tried skiing.</i></li><li><b>Результат в настоящем</b>: <i>He's broken his leg (and it's in plaster now).</i></li><li><b>Незаконченный период</b> с <b>for / since</b>: <i>I've lived here for five years</i> — «Я живу здесь пять лет (и сейчас тоже)».</li></ol><p>Русское настоящее время «живу пять лет» часто требует в английском именно Present Perfect.</p>",
formulas:["have / has + V3","for + период (for two years), since + точка отсчёта (since 2020)"],
aff:[["I've known her since school.","Я знаю её со школы."],["They've just arrived.","Они только что приехали."]],
neg:[["I haven't finished yet.","Я ещё не закончил."]],
q:[["How long have you worked here?","Сколько ты здесь работаешь?"],["Has the parcel arrived yet?","Посылка уже пришла?"]],
table:"<table class='t'><tr><th>Present Perfect</th><th>Past Simple</th></tr><tr><td>Время не указано / важен результат</td><td>Указано время в прошлом</td></tr><tr><td><i>I've lost my phone.</i></td><td><i>I lost my phone yesterday.</i></td></tr><tr><td>Период не закончен: <i>this week, today</i></td><td>Период закончен: <i>last week</i></td></tr></table>",
exceptions:"<p><b>been to</b> vs <b>gone to</b>: <i>He has been to Paris</i> (был и вернулся) / <i>He has gone to Paris</i> (уехал и сейчас там).</p>",
mistakes:["«I live here for five years» — <b>I have lived here for five years</b>.","«since two years» — с периодом <b>for</b>: for two years.","«When have you arrived?» — с when Past Simple: <b>When did you arrive?</b>"],
ex:[{q:"I ___ (know) him for ten years.",a:["have known","'ve known"],e:"Незаконченный период + for."},{q:"She has worked here ___ 2019.",o:["for","since","from"],a:1,e:"Точка отсчёта → since."},{q:"When ___ you start learning English?",o:["have","did"],a:1,e:"When → Past Simple."},{q:"Tom isn't here. He ___ to the shop.",o:["has been","has gone"],a:1,e:"Ушёл и ещё не вернулся → gone."},{q:"I've lived in Almaty ___ three years.",a:["for"],e:"Период → for."}],
quiz:[{q:"Выберите верное:",o:["I study English since 2020.","I have studied English since 2020."],a:1,e:"since → Present Perfect."},{q:"Have you finished ___?",o:["already","yet","ago"],a:1,e:"В вопросе в конце — yet."},{q:"I ___ my keys. I can't open the door.",o:["lost","have lost"],a:1,e:"Важен результат сейчас."}],
summary:"Опыт, результат, незаконченный период (for/since). С конкретным прошлым временем — Past Simple."},

"passive":{level:"B1",title:"Passive Voice",
explain:"<p><b>Страдательный залог</b> используется, когда важно действие или его объект, а не тот, кто его выполнил: <i>The museum was built in 1850</i>. Исполнитель вводится через <b>by</b>, если он важен.</p><p>Формула всегда одна: <b>be</b> в нужном времени + <b>V3</b>.</p>",
formulas:["Объект + be (в нужном времени) + V3 (+ by …)"],
aff:[["English is spoken all over the world.","На английском говорят по всему миру."],["The letter was written by my grandfather.","Письмо написал мой дедушка."],["The road is being repaired.","Дорогу ремонтируют."]],
neg:[["The room hasn't been cleaned.","Комнату не убрали."]],
q:[["When was the bridge built?","Когда построили мост?"],["Will the results be published?","Результаты опубликуют?"]],
table:"<table class='t'><tr><th>Время</th><th>Active</th><th>Passive</th></tr><tr><td>Present Simple</td><td>They make cars.</td><td>Cars are made.</td></tr><tr><td>Past Simple</td><td>They made cars.</td><td>Cars were made.</td></tr><tr><td>Present Continuous</td><td>They are making…</td><td>…are being made.</td></tr><tr><td>Present Perfect</td><td>They have made…</td><td>…have been made.</td></tr><tr><td>Future (will)</td><td>They will make…</td><td>…will be made.</td></tr><tr><td>Модальные</td><td>They must make…</td><td>…must be made.</td></tr></table>",
exceptions:"<p>Непереходные глаголы (arrive, happen, die) в пассив не ставятся: не «It was happened», а <b>It happened</b>.</p>",
mistakes:["«The house built in 1990» — пропущен be: <b>was built</b>.","«It was happened» — happen не бывает в пассиве.","«The book was wrote» — нужна V3: <b>written</b>."],
ex:[{q:"This bridge ___ (build) in 1900.",a:["was built"],e:"Past Simple Passive: was + built."},{q:"Coffee ___ in Brazil.",o:["grows","is grown","is growing"],a:1,e:"Present Simple Passive."},{q:"The results ___ tomorrow.",o:["will announce","will be announced"],a:1,e:"Future Passive: will be + V3."},{q:"My car ___ at the moment.",o:["is repaired","is being repaired"],a:1,e:"Continuous Passive: is being + V3."},{q:"The window has ___ broken.",a:["been"],e:"has been + V3."}],
quiz:[{q:"Выберите верное:",o:["The accident was happened at night.","The accident happened at night."],a:1,e:"happen — непереходный."},{q:"The film ___ by millions of people.",o:["has seen","has been seen"],a:1,e:"has been + V3."},{q:"Mistakes must ___.",o:["correct","be corrected"],a:1,e:"Модальный + be + V3."}],
summary:"be + V3. Время показывает глагол be. Исполнитель — через by, если важен."},

"second-cond":{level:"B1",title:"Second Conditional",
explain:"<p><b>Second Conditional</b> описывает <b>нереальную или маловероятную</b> ситуацию в настоящем или будущем: <i>If I had a million dollars, I would travel the world.</i> В русском это «если бы…, то…».</p><p>Хотя используется Past Simple, речь идёт <b>не о прошлом</b>, а о воображаемом настоящем.</p>",
formulas:["If + Past Simple, would + V"],
aff:[["If I were you, I would accept the offer.","На твоём месте я бы принял предложение."],["If she lived closer, we'd see her more often.","Если бы она жила ближе, мы бы видели её чаще."]],
neg:[["If I didn't have to work, I'd go with you.","Если бы мне не надо было работать, я бы пошёл с тобой."]],
q:[["What would you do if you won the lottery?","Что бы ты сделал, если бы выиграл в лотерею?"]],
exceptions:"<p>С <b>be</b> во всех лицах допустимо и рекомендуется в формальной речи <b>were</b>: <i>If I were…, If he were…</i>. Вместо would можно <b>could / might</b>.</p>",
mistakes:["«If I would have…» — после if без would: <b>If I had</b>.","«If I was you» — в стандартном варианте <b>If I were you</b>."],
ex:[{q:"If I ___ (have) more time, I would learn Japanese.",a:["had"],e:"if + Past Simple."},{q:"If he ___ rich, he would buy a yacht.",o:["is","were","would be"],a:1,e:"Нереальное: were."},{q:"I ___ help you if I could.",o:["will","would","am"],a:1,e:"Результат: would + V."},{q:"What would you do if you ___ a ghost?",o:["see","saw","would see"],a:1,e:"if + Past Simple."}],
quiz:[{q:"Выберите верное:",o:["If I would know, I would tell you.","If I knew, I would tell you."],a:1,e:"После if без would."},{q:"Second Conditional описывает:",o:["реальное будущее","нереальное настоящее/будущее","прошлое"],a:1,e:"Воображаемую ситуацию."},{q:"If I ___ you, I'd apologise.",o:["am","were","be"],a:1,e:"If I were you."}],
summary:"If + Past Simple, would + V — «если бы» о настоящем/будущем. If I were you — совет."},

"reported":{level:"B1",title:"Reported Speech",
explain:"<p><b>Косвенная речь</b> передаёт чужие слова. Если глагол-вводка в прошедшем времени (<i>said, told</i>), время в придаточном обычно <b>сдвигается на шаг назад</b> (backshift).</p><p>Также меняются местоимения и указатели времени и места: <i>now → then, today → that day, tomorrow → the next day, here → there</i>.</p>",
formulas:["say (that) + clause; tell + кого-то + (that) + clause","Вопросы: asked + if/whether + прямой порядок слов"],
aff:[["\"I'm tired.\" → She said (that) she was tired.","Она сказала, что устала."],["\"I will call you.\" → He told me he would call me.","Он сказал, что позвонит мне."]],
neg:[["\"I don't like it.\" → He said he didn't like it.","Он сказал, что ему это не нравится."]],
q:[["\"Where do you live?\" → She asked me where I lived.","Она спросила, где я живу."],["\"Are you OK?\" → He asked if I was OK.","Он спросил, всё ли у меня хорошо."]],
table:"<table class='t'><tr><th>Прямая речь</th><th>Косвенная</th></tr><tr><td>Present Simple</td><td>Past Simple</td></tr><tr><td>Present Continuous</td><td>Past Continuous</td></tr><tr><td>Present Perfect / Past Simple</td><td>Past Perfect</td></tr><tr><td>will</td><td>would</td></tr><tr><td>can</td><td>could</td></tr></table>",
exceptions:"<p>Если сказанное остаётся верным, сдвиг не обязателен: <i>He said the Earth goes round the Sun.</i> Если вводка в настоящем (<i>says</i>), сдвига нет.</p>",
mistakes:["«He said me» — <b>He told me</b> или <b>He said to me</b>.","«She asked where do I live» — в косвенном вопросе прямой порядок: <b>where I lived</b>."],
ex:[{q:"\"I am busy.\" → He said he ___ busy.",a:["was"],e:"am → was."},{q:"\"I can swim.\" → She said she ___ swim.",o:["can","could","would"],a:1,e:"can → could."},{q:"He ___ me that he was leaving.",o:["said","told","asked"],a:1,e:"tell + кого-то."},{q:"She asked me where I ___.",o:["did live","lived","do live"],a:1,e:"Прямой порядок, backshift."}],
quiz:[{q:"\"I will help.\" → He said he ___ help.",o:["will","would"],a:1,e:"will → would."},{q:"Выберите верное:",o:["She said me hello.","She told me hello.","She said hello to me."],a:2,e:"say something to someone."},{q:"\"Do you like jazz?\" → He asked ___ I liked jazz.",o:["that","if","do"],a:1,e:"Общий вопрос → if/whether."}],
summary:"Сдвиг времён назад после said/told. Косвенные вопросы — прямой порядок слов, if/whether для общих вопросов."},

"used-to":{level:"B1",title:"Used to / Be used to / Get used to",
explain:"<p>Три похожие конструкции с разным смыслом:</p><ul><li><b>used to + V</b> — прошлая привычка или состояние, которых больше нет: <i>I used to smoke</i> (раньше курил).</li><li><b>be used to + V-ing / сущ.</b> — быть привычным к чему-то: <i>I'm used to getting up early.</i></li><li><b>get used to + V-ing / сущ.</b> — привыкать: <i>You'll get used to the climate.</i></li></ul>",
formulas:["used to + V (инфинитив)","be / get used to + V-ing / существительное"],
aff:[["We used to live in a village.","Раньше мы жили в деревне."],["She's used to working at night.","Она привыкла работать по ночам."]],
neg:[["I didn't use to like vegetables.","Раньше я не любил овощи."]],
q:[["Did you use to play football?","Ты раньше играл в футбол?"],["Are you used to the noise?","Ты привык к шуму?"]],
exceptions:"<p>В вопросах и отрицаниях с did пишется <b>use to</b> (без d). Для прошлых повторяющихся действий также используется <b>would</b>, но не для состояний: <i>I would play outside</i>, но не «I would have a dog».</p>",
mistakes:["«I am used to get up early» — после be used to нужен -ing: <b>getting</b>.","«I use to live here» (о прошлом) — <b>I used to live</b>."],
ex:[{q:"I ___ play the piano when I was a child.",o:["used to","am used to","get used to"],a:0,e:"Прошлая привычка."},{q:"He is used to ___ (drive) on the left.",a:["driving"],e:"be used to + V-ing."},{q:"Did you ___ have long hair?",o:["used to","use to"],a:1,e:"После did — use to."},{q:"It took me a month to get used ___ the new job.",a:["to"],e:"get used to."}],
quiz:[{q:"«Я привык к холоду»:",o:["I used to the cold.","I'm used to the cold."],a:1,e:"be used to + сущ."},{q:"She ___ work here, but now she works at home.",o:["used to","is used to"],a:0,e:"Прошлое, которого нет."},{q:"You'll soon get used to ___ English every day.",o:["speak","speaking"],a:1,e:"get used to + V-ing."}],
summary:"used to + V — «раньше»; be used to + -ing — «привык»; get used to + -ing — «привыкать»."},

"mixed-cond":{level:"B2",title:"Mixed Conditionals",
explain:"<p><b>Смешанные условные</b> соединяют разные временные планы:</p><ul><li><b>Прошлое условие → настоящий результат</b>: <i>If I had studied medicine, I would be a doctor now.</i></li><li><b>Настоящее (постоянное) условие → прошлый результат</b>: <i>If I weren't so shy, I would have spoken to her yesterday.</i></li></ul>",
formulas:["If + Past Perfect, would + V (сейчас)","If + Past Simple, would have + V3 (тогда)"],
aff:[["If I had taken that job, I would live in London now.","Если бы я тогда согласился на ту работу, я бы сейчас жил в Лондоне."],["If she were more careful, she wouldn't have made that mistake.","Будь она внимательнее, она бы не допустила той ошибки."]],
neg:[["If we hadn't missed the flight, we wouldn't be stuck here.","Если бы мы не опоздали на рейс, мы бы здесь не застряли."]],
q:[["Would you be happier now if you had moved abroad?","Был бы ты сейчас счастливее, если бы переехал за границу?"]],
exceptions:"<p>Ориентируйтесь на маркеры времени: <i>now, today</i> подсказывают настоящий результат; <i>yesterday, last year</i> — прошлый.</p>",
mistakes:["«If I would have studied…» — после if без would.","Смешение: «If I had studied, I would have been a doctor now» — с <b>now</b> нужен <b>would be</b>."],
ex:[{q:"If I had saved money, I ___ rich now.",o:["would be","would have been"],a:0,e:"Результат сейчас → would be."},{q:"If he ___ afraid of flying, he would have come to the wedding.",o:["weren't","hadn't been"],a:0,e:"Постоянное состояние (боится вообще) → weren't."},{q:"If you ___ (listen) to me, you wouldn't be in trouble now.",a:["had listened"],e:"Прошлое условие → Past Perfect."}],
quiz:[{q:"If I ___ the train, I would be at home now.",o:["didn't miss","hadn't missed"],a:1,e:"Прошлое событие → Past Perfect."},{q:"If she spoke French, she ___ the job last year.",o:["would get","would have got"],a:1,e:"Прошлый результат → would have + V3."},{q:"Mixed conditional сочетает:",o:["разные временные планы","только прошлое","только будущее"],a:0,e:"Прошлое и настоящее."}],
summary:"Прошлое условие + настоящий результат: had V3 → would V. Постоянное условие + прошлый результат: V2 → would have V3."},

"inversion":{level:"B2",title:"Inversion",
explain:"<p><b>Инверсия</b> — обратный порядок слов (вспомогательный глагол перед подлежащим) в утвердительном предложении. Используется после <b>отрицательных и ограничительных</b> наречий в начале фразы, чтобы добавить эмфазу. Характерна для формального и письменного стиля.</p>",
formulas:["Never / Rarely / Seldom + aux + подлежащее + V","Not only + aux + S + V, but … also","Hardly / No sooner + had + S + V3 … when / than","Only then / Only after … + aux + S + V"],
aff:[["Never have I seen such a beautiful view.","Никогда я не видел такого красивого вида."],["Not only did he lie, but he also stole money.","Он не только солгал, но и украл деньги."],["No sooner had we arrived than it started to rain.","Не успели мы приехать, как пошёл дождь."]],
neg:[["Under no circumstances should you open this door.","Ни при каких обстоятельствах не открывайте эту дверь."]],
q:[["(Инверсия в условных) Had I known, I would have helped.","Знай я, я бы помог."]],
exceptions:"<p>Инверсия в условных без if: <i>Should you need help, call me</i> (= If you should need…); <i>Were I you…</i> (= If I were you); <i>Had I known…</i> (= If I had known).</p>",
mistakes:["«Never I have seen» — <b>Never have I seen</b>.","«Not only he is smart» — <b>Not only is he smart</b>.","«No sooner had we arrived when» — после no sooner: <b>than</b>."],
ex:[{q:"Rarely ___ such talent.",o:["I have seen","have I seen","I saw"],a:1,e:"Rarely + aux + S."},{q:"No sooner had she left ___ the phone rang.",o:["when","than","then"],a:1,e:"No sooner … than."},{q:"___ I known, I would have come.",o:["If","Had","Have"],a:1,e:"Had I known = If I had known."},{q:"Not only ___ (he / speak) French, but also Arabic. (Present Simple)",a:["does he speak"],e:"Not only + does + he + speak."}],
quiz:[{q:"Выберите верное:",o:["Seldom we go out.","Seldom do we go out."],a:1,e:"Инверсия с do."},{q:"Hardly had I sat down ___ the bell rang.",o:["than","when"],a:1,e:"Hardly … when."},{q:"___ you need any help, please let us know.",o:["Should","Would","Had"],a:0,e:"Should you = If you should."}],
summary:"Отрицательное наречие в начале → вспомогательный глагол перед подлежащим. Стиль — формальный."},

"cleft":{level:"C1",title:"Cleft Sentences",
explain:"<p><b>Расщеплённые предложения</b> выделяют одну часть высказывания, разбивая его на две. Это основной способ логического ударения в английском (в русском для этого часто меняют порядок слов или используют «именно»).</p><ul><li><b>It-cleft</b>: <i>It was John who broke the window</i> (Именно Джон…).</li><li><b>Wh-cleft</b>: <i>What I need is a holiday</i> (Что мне нужно, так это отпуск).</li><li><b>All-cleft</b>: <i>All I want is some peace</i> (Всё, чего я хочу…).</li></ul>",

text:"The idea of the 'fifteen-minute city' has gained considerable attention among urban planners. The concept is straightforward: residents should be able to reach most of their daily needs — work, shops, schools, healthcare and green spaces — within a fifteen-minute walk or bike ride from home. Supporters argue that such neighbourhoods reduce car dependency, cut emissions and strengthen local communities. Paris has become the best-known example, having converted a number of roads into cycle lanes and pedestrian areas.\n\nCritics, however, point out several drawbacks. In many cities, housing in well-served areas is already expensive, and improving local services could push prices even higher, forcing lower-income residents out. Others worry that the model is difficult to apply to sprawling suburbs designed around the car. Nevertheless, most experts agree that the debate has encouraged cities to rethink how space is used, even if the fifteen-minute goal itself is not always achievable.",

{id:"r-c1-memory",level:"C1",title:"The Unreliable Witness",topic:"Психология",
text:"It is widely assumed that memory functions like a video recording, faithfully preserving events so that they can be replayed at will. Decades of psychological research, however, suggest otherwise. Memories are reconstructed each time they are recalled, and this process leaves them vulnerable to distortion. In a series of now-famous experiments, participants who watched footage of a car accident estimated significantly higher speeds when asked how fast the cars were going when they 'smashed' into each other, rather than when they 'hit' each other. Some even reported seeing broken glass that had never been there.\n\nThe implications for the justice system are profound. Eyewitness testimony, long regarded as among the most compelling forms of evidence, has been implicated in a substantial proportion of wrongful convictions later overturned by DNA analysis. This is not to say that witnesses are dishonest; rather, their confidence is often a poor indicator of accuracy. Consequently, many researchers advocate procedural reforms, such as recording a witness's initial level of certainty and ensuring that line-ups are conducted by officers who do not know which person is the suspect.",

{id:"r-c2-language",level:"C2",title:"Does Language Shape Thought?",topic:"Философия и лингвистика",
text:"Few ideas in linguistics have proved as seductive, or as contentious, as the notion that the language we speak determines the way we think. In its strong form, often attributed to Benjamin Lee Whorf, the hypothesis holds that speakers of different languages inhabit fundamentally different conceptual worlds. This deterministic version has been largely discredited: people evidently can think about concepts for which their language has no single word, and translation, however imperfect, remains possible.\n\nYet a more modest claim — that language may subtly influence habitual patterns of attention and memory — has enjoyed something of a revival. Studies have found, for instance, that speakers of languages which obligatorily distinguish between shades of blue are marginally faster at discriminating those shades. Such effects, while measurable, are hardly the radical relativism Whorf envisaged. The prevailing view, then, is a nuanced one: language is less a prison than a set of well-worn paths, which we tend to follow, but from which we are perfectly able to stray.",

// Базовая (офлайн) проверка письма — честно ограниченная
const RULES = [
  [/\bi\b(?!')/g, "I", "Местоимение I всегда пишется с заглавной буквы.", "spelling"],
  [/\bi'm\b/g, "I'm", "I'm — с заглавной буквы.", "spelling"],
  [/\b(I|you|we|they) am agree\b/gi, "$1 agree", "agree — глагол; am не нужен: I agree.", "grammar"],
  [/\b(I|you|we|they) (is|are) agree\b/gi, "$1 agree", "agree — глагол, to be не нужен.", "grammar"],
  [/\b(he|she|it) don't\b/gi, "$1 doesn't", "С he/she/it отрицание — doesn't.", "grammar"],
  [/\b(he|she|it) have\b/gi, "$1 has", "С he/she/it — has.", "grammar"],
  [/\bdid(n't| not)? (\w+ )?(went|saw|came|took|made|bought|ate|wrote|had)\b/gi, null, "После did глагол стоит в начальной форме (did go, didn't see).", "grammar"],
  [/\bpeople is\b/gi, "people are", "people — множественное число: people are.", "grammar"],
  [/\b(informations|advices|furnitures|knowledges|homeworks|luggages|researches)\b/gi, m => m.slice(0, -1), "Это неисчисляемое существительное — без -s.", "grammar"],
  [/\bmore (better|worse|bigger|smaller|easier|harder)\b/gi, "$1", "Двойное сравнение: достаточно одной формы (better).", "grammar"],
  [/\bexplain me\b/gi, "explain to me", "explain something to somebody.", "word choice"],
  [/\bmarried with\b/gi, "married to", "married to somebody.", "word choice"],
  [/\bsince (\d+|two|three|four|five|ten) (years|months|days|weeks)\b/gi, "for $1 $2", "С периодом времени — for, since — с точкой отсчёта.", "grammar"],
  [/\ba ([aeio]\w+)/gi, "an $1", "Перед гласным звуком — an.", "grammar"],
  [/\bdepend from\b/gi, "depend on", "depend on.", "word choice"],
  [/\b(we|they|you) was\b/gi, "$1 were", "С we/you/they — were (was только с I, he, she, it).", "grammar"],
  [/\bin the internet\b/gi, "on the internet", "on the internet.", "word choice"],
  [/\bmake (a )?(mistake|homework)s?\b/gi, null, "Сочетания: make a mistake, но do homework.", "word choice"],
  [/\b(recieve|beleive|untill|wich|becouse|freind|adress|tommorow|definately|goverment|enviroment|beautifull|realy|wierd|seperate|accomodation|occured|begining|studing)\b/gi, m => ({recieve:"receive",beleive:"believe",untill:"until",wich:"which",becouse:"because",freind:"friend",adress:"address",tommorow:"tomorrow",definately:"definitely",goverment:"government",enviroment:"environment",beautifull:"beautiful",realy:"really",wierd:"weird",seperate:"separate",accomodation:"accommodation",occured:"occurred",begining:"beginning",studing:"studying"})[m.toLowerCase()], "Орфографическая ошибка.", "spelling"]
];
const LINKERS = ["however", "moreover", "therefore", "although", "because", "for example", "for instance", "in addition", "on the other hand", "firstly", "secondly", "finally", "in conclusion", "as a result", "furthermore", "whereas", "despite", "while", "so", "but", "also", "to sum up", "nevertheless", "consequently"];
function basicCheck(text) {
  let corrected = text; const errors = [];
  const seenE = new Set();
  for (const [re, rep, expl, type] of RULES) {
    const m = text.match(re); if (!m) continue;
    const skipA = frag => re.source.startsWith("\\ba (") && /^a (use|uni|euro|one|once|u\w)/i.test(frag);
    const fixOf = frag => { let f = typeof rep === "function" ? rep(frag) : frag.replace(new RegExp(re.source, re.flags.replace("g", "")), rep); if (/^[A-Z]/.test(frag) && /^[a-z]/.test(f)) f = f[0].toUpperCase() + f.slice(1); return f; };
    m.forEach(frag => { if (skipA(frag)) return; const fix = rep === null ? "—" : fixOf(frag); const k = frag + "→" + fix; if (seenE.has(k)) return; seenE.add(k); errors.push({ original: frag, fix, type: type || "grammar", explanation_ru: expl }); });
    if (rep !== null) corrected = corrected.replace(new RegExp(re.source, re.flags.includes("g") ? re.flags : re.flags + "g"), frag => skipA(frag) ? frag : fixOf(frag));
  }
  const sents = text.split(/(?<=[.!?])\s+/).filter(x => x.trim());
  sents.forEach(s0 => { const s = s0.trim(); if (/^[a-z]/.test(s)) { errors.push({ original: s.slice(0, 18) + "…", fix: s[0].toUpperCase() + s.slice(1, 18) + "…", type: "punctuation", explanation_ru: "Предложение начинается с заглавной буквы." }); corrected = corrected.replace(s, s[0].toUpperCase() + s.slice(1)); } });
  if (text.trim() && !/[.!?]$/.test(text.trim())) { errors.push({ original: "…" + text.trim().slice(-12), fix: "…" + text.trim().slice(-12) + ".", type: "punctuation", explanation_ru: "В конце предложения нужен знак препинания." }); corrected = corrected.trim() + "."; }
  if (/ {2,}/.test(text)) errors.push({ original: "двойные пробелы", fix: "один пробел", type: "punctuation", explanation_ru: "Лишние пробелы." });
  if (/\s[,.]/.test(text)) errors.push({ original: "пробел перед знаком", fix: "без пробела", type: "punctuation", explanation_ru: "Перед запятой и точкой пробел не ставится." });
  const words = (text.toLowerCase().match(/[a-z']+/g) || []); const uniq = new Set(words);
  const ttr = words.length ? uniq.size / words.length : 0; const avgLen = sents.length ? words.length / sents.length : 0;
  const linkers = LINKERS.filter(l => new RegExp("\\b" + l + "\\b", "i").test(text));
  return { corrected, errors, stats: { words: words.length, sentences: sents.length, ttr: Math.round(ttr * 100), avgLen: Math.round(avgLen * 10) / 10, linkers } };
}

      ${it.o ? it.o.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("") : `<div class="row"><input type="text" id="gapIn" placeholder="Ваш ответ" autocomplete="off" style="flex:1;min-width:200px"><button class="btn pri" id="gapOk">Проверить</button></div>`}
      <div id="fb"></div></div>`;
    const finish = (ok, userAns, rightAns) => {
      if (ok) score++; else logMistake(opt.section || "Упражнение", it.q, userAns, rightAns, it.e);
      res.push({ q: it.q, ok, user: userAns, right: rightAns });
      $("#fb", box).innerHTML = `<div class="${ok ? "note" : "err"}" style="margin-top:10px"><span class="${ok ? "fb-ok" : "fb-no"}">${ok ? "✓ Верно!" : "✗ Неверно."}</span> ${ok ? "" : "Правильный ответ: <b>" + esc(rightAns) + "</b>."} ${it.e ? "<br>" + esc(it.e) : ""}</div><button class="btn pri" id="nextQ" style="margin-top:10px">Дальше →</button>`;
      $("#nextQ", box).onclick = () => { i++; draw(); }; $("#nextQ", box).focus();
    };
    if (it.o) $$(".opt", box).forEach(b => b.onclick = () => { if ($("#nextQ", box)) return; const k = +b.dataset.k; const ok = k === it.a; b.classList.add(ok ? "ok" : "no"); $$(".opt", box)[it.a].classList.add("ok"); finish(ok, it.o[k], it.o[it.a]); });
    else { const inp = $("#gapIn", box); inp.focus(); const go = () => { if ($("#nextQ", box)) return; const v = norm(inp.value); const ok = it.a.some(x => norm(x) === v); inp.disabled = true; finish(ok, inp.value || "(пусто)", it.a[0]); }; $("#gapOk", box).onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); }; }
  };

  const go = { Reading: "det-interactive-reading", Listening: "det-listen-type", Writing: "writing", Speaking: "speaking", Vocabulary: "study-review", Grammar: "grammar" };
  if (sk.length >= 2) { sk.sort((a, b) => b[1] - a[1]); const best = sk[0], worst = sk[sk.length - 1]; if (best[1] - worst[1] >= 10) out.push([`У тебя хорошие результаты по ${RU[best[0]]} (${best[1]}%), но есть трудности по ${RU[worst[0]]} (${worst[1]}%). Рекомендуем уделить больше времени именно этому навыку.`, go[worst[0]]]); }

}

function mistakeReview(v) {

  const items = open.map(m => { const others = pick(s.mistakes.filter(x => x !== m && x.correct && x.correct.length < 60).map(x => x.correct), 2); const o = shuffle([...new Set([m.correct, m.user, ...others])].filter(x => x && x !== "(пусто)" && x !== "не вспомнил").slice(0, 4)); return { m, q: m.q, o: o.includes(m.correct) ? o : [m.correct, ...o], e: m.expl }; }).map(it => ({ ...it, a: it.o.indexOf(it.m.correct) }));

}

function contentIssues() {
  const iss = []; const seen = {};
  VOCAB.forEach(w => { const k = w.word.toLowerCase() + "|" + w.pos; if (seen[k] && seen[k] !== w.level) iss.push(["warn", `Повтор слова «${w.word}» на уровнях ${seen[k]} и ${w.level}`, w.id]); seen[k] = seen[k] || w.level;
    if (!w.ru) iss.push(["err", `Нет перевода: ${w.word}`, w.id]); if (!w.ipa) iss.push(["err", `Нет IPA: ${w.word}`, w.id]); if (!w.rupr) iss.push(["warn", `Нет русской подсказки: ${w.word}`, w.id]); if (!w.ex) iss.push(["warn", `Нет примера: ${w.word}`, w.id]); if (!LEVELS.includes(w.level)) iss.push(["err", `Неверный уровень у ${w.word}`, w.id]); if (w.ai) iss.push(["info", `Добавлено AI, требует проверки: ${w.word}`, w.id]); });
  LEVELS.forEach(L => GRAMMAR_TOPICS[L].forEach(t => { const [n, id] = t.split("|"); const l = GRAMMAR_LESSONS[id] || CUSTOM_LESSONS[id]; if (!l) iss.push(["info", `Тема без авторского урока (используется AI-генерация): ${L} ${n}`]); else { [...(l.ex || []), ...(l.quiz || [])].forEach((x, i) => { if (x.o && (x.a < 0 || x.a >= x.o.length)) iss.push(["err", `Ошибка в упражнении ${i + 1} урока «${n}»: неверный индекс ответа`]); if (!x.o && !(Array.isArray(x.a) && x.a.length)) iss.push(["err", `Упражнение ${i + 1} урока «${n}» без ответа`]); }); } }));
  if (!Audio.hasBrowser() && !Audio.tts) iss.push(["err", "Озвучка недоступна в текущем браузере: аудиокнопки не будут работать."]);
  const per = Object.fromEntries(LEVELS.map(l => [l, VOCAB.filter(w => w.level === l).length])); const target = { A1: 600, A2: 800, B1: 1000, B2: 1200, C1: 1500, C2: 1500 }; LEVELS.forEach(l => { if (per[l] < target[l]) iss.push(["info", `Уровень ${l}: ${per[l]} из целевых ${target[l]} слов — пополните базу импортом`]); });
  return iss;
}

      $("#iEx").onclick = () => $("#iTxt").value = "word,translation,pos,ipa,ru_pron,example,example_ru,level,topic\nkettle,чайник,n,ˈketl,кэ́тл,I put the kettle on.,Я поставил чайник.,A2,house2\nthorough,тщательный,adj,ˈθʌrə,,She did a thorough job.,Она тщательно выполнила работу.,B2,abstract";
      $("#iDump").onclick = async () => { const data = JSON.stringify(VOCAB.map(w => ({ word: w.word, translation: w.ru, pos: w.pos, ipa: w.ipa, ru_pron: w.rupr, example: w.ex, example_ru: w.exru, level: w.level, topic: w.topic, forms: w.forms, synonyms: w.syn, antonyms: w.ant, collocations: w.col, mistake: w.mis }))); try { await navigator.clipboard.writeText(data); toast(`Скопировано: ${VOCAB.length} слов`); } catch { modal(`<h2>Экспорт</h2><textarea style="min-height:300px">${esc(data)}</textarea>`); } };
      $("#iGo").onclick = () => { const txt = $("#iTxt").value.trim(); let rows = []; try { if (txt.startsWith("[")) rows = JSON.parse(txt); else { const lines = txt.split(/\r?\n/).filter(Boolean); const sep = lines[0].includes(";") ? ";" : ","; const parseLine = l => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map(x => x.trim()); }; const hd = parseLine(lines[0]).map(h => h.toLowerCase()); rows = lines.slice(1).map(l => { const c = parseLine(l); return Object.fromEntries(hd.map((h, i) => [h, c[i] || ""])); }); } } catch (e) { $("#iRes").innerHTML = `<div class="err">Не удалось разобрать данные: ${esc(e.message)}</div>`; return; }
        let ok = 0, skip = [], upd = 0; rows.forEach((r, i) => { const w = { word: (r.word || "").trim(), ru: r.translation || r.ru || "", pos: r.pos || "n", ipa: (r.ipa || "").replace(/^\/|\/$/g, ""), rupr: r.ru_pron || r.rupr || "", ex: r.example || r.ex || "", exru: r.example_ru || r.exru || "", level: (r.level || "A1").toUpperCase(), topic: r.topic || "custom", forms: r.forms || "", syn: r.synonyms || r.syn || "", ant: r.antonyms || r.ant || "", col: r.collocations || r.col || "", mis: r.mistake || r.mis || "" }; if (!w.word || !w.ru || !w.ipa || !LEVELS.includes(w.level)) { skip.push(i + 2); return; } if (!w.rupr) w.rupr = ipaToRu(w.ipa); const id = w.level + ":" + w.word.toLowerCase(); if (VBYID[id]) upd++; else ok++; const nw = addWord({ ...w, id }); const ci = s.custom.words.findIndex(x => x.id === id); ci >= 0 ? (s.custom.words[ci] = nw) : s.custom.words.push(nw); if (!TOPIC_NAMES[w.topic]) TOPIC_NAMES[w.topic] = w.topic; });
        Store.save(true); $("#iRes").innerHTML = `<div class="note">Добавлено: <b>${ok}</b> · обновлено: <b>${upd}</b> · пропущено: <b>${skip.length}</b>${skip.length ? ` (строки ${skip.slice(0, 20).join(", ")}${skip.length > 20 ? "…" : ""}: нет слова, перевода, IPA или неверный уровень)` : ""}</div>`; };
    }
    if (tab === "lessons") {
      const opts = LEVELS.flatMap(L => GRAMMAR_TOPICS[L].map(t => [L, ...t.split("|")]));
      ap.innerHTML = `<div class="card stack"><h3>Создать или изменить урок</h3><div><label class="f">Тема</label><select id="lT">${opts.map(([L, n, id]) => `<option value="${id}">${L} · ${esc(n)}${GRAMMAR_LESSONS[id] ? " (встроенный)" : CUSTOM_LESSONS[id] || s.custom.lessons[id] ? " (ваш)" : ""}</option>`).join("")}</select></div>
      <p class="muted" style="font-size:13px">Урок — JSON со структурой: explain (HTML), formulas[], aff/neg/q [[EN,RU]], table (HTML), exceptions (HTML), mistakes[], ex[{q,o[],a,e}] (для ввода ответа: a — массив допустимых ответов), quiz[], summary. Загрузите текущий урок, отредактируйте и сохраните.</p>
      <div class="row"><button class="btn" id="lLoad">Загрузить текущий</button><button class="btn" id="lTpl">Шаблон</button></div><textarea id="lJ" style="min-height:320px;font-family:ui-monospace,monospace;font-size:13px"></textarea><div class="row"><button class="btn pri" id="lSave">Сохранить урок</button><span id="lErr" class="fb-no"></span></div>
      <h3>Добавить упражнение к уроку</h3><div class="grid" style="grid-template-columns:2fr 2fr 1fr;gap:8px"><input type="text" id="eQ" placeholder="Вопрос с ___"><input type="text" id="eO" placeholder="Варианты через | (пусто — ввод ответа)"><input type="text" id="eA" placeholder="Ответ"></div><input type="text" id="eE" placeholder="Объяснение (по-русски)"><button class="btn" id="eAdd">Добавить упражнение</button></div>`;
      const cur = () => $("#lT").value; const getL = id => s.custom.lessons[id] || CUSTOM_LESSONS[id] || GRAMMAR_LESSONS[id] || s.gen[id];
      $("#lLoad").onclick = () => { const l = getL(cur()); $("#lJ").value = l ? JSON.stringify(l, null, 2) : "Урока пока нет — нажмите «Шаблон»."; };
      $("#lTpl").onclick = () => { const m = topicMeta(cur()); $("#lJ").value = JSON.stringify({ level: m.L, title: m.title, explain: "<p>Объяснение…</p>", formulas: [""], aff: [["", ""]], neg: [["", ""]], q: [["", ""]], table: "", exceptions: "", mistakes: [""], ex: [{ q: "___", o: ["", "", ""], a: 0, e: "" }], quiz: [{ q: "", o: ["", ""], a: 0, e: "" }], summary: "" }, null, 2); };
      $("#lSave").onclick = () => { try { const l = JSON.parse($("#lJ").value); if (!l.explain || !Array.isArray(l.ex)) throw new Error("Нужны поля explain и ex[]"); s.custom.lessons[cur()] = l; CUSTOM_LESSONS[cur()] = l; Store.save(true); toast("Урок сохранён"); $("#lErr").textContent = ""; } catch (e) { $("#lErr").textContent = "Ошибка JSON: " + e.message; } };
      $("#eAdd").onclick = () => { const id = cur(); const base = JSON.parse(JSON.stringify(getL(id) || null)); if (!base) return toast("Сначала создайте урок"); const o = $("#eO").value.split("|").map(x => x.trim()).filter(Boolean); const a = $("#eA").value.trim(); const ex = o.length ? { q: $("#eQ").value, o, a: Math.max(0, o.indexOf(a)), e: $("#eE").value } : { q: $("#eQ").value, a: a.split("/").map(x => x.trim()), e: $("#eE").value }; if (!ex.q || !a) return toast("Заполните вопрос и ответ"); if (o.length && !o.includes(a)) return toast("Ответ должен совпадать с одним из вариантов"); base.ex.push(ex); s.custom.lessons[id] = base; CUSTOM_LESSONS[id] = base; Store.save(true); toast("Упражнение добавлено"); $("#lJ").value = JSON.stringify(base, null, 2); };
    }
    if (tab === "check") ap.innerHTML = `<div class="card stack"><h3>Проверка полноты контента</h3><p class="muted" style="font-size:13px">⛔ ошибки · ⚠️ предупреждения · ℹ️ информация</p>${iss.length ? iss.slice(0, 300).map(([t, m, id]) => `<div class="${t === "err" ? "err" : t === "warn" ? "warn" : "note"}" style="font-size:14px;padding:8px 12px">${t === "err" ? "⛔" : t === "warn" ? "⚠️" : "ℹ️"} ${esc(m)} ${id ? `<a href="#" data-act="word" data-id="${esc(id)}">открыть</a>` : ""}</div>`).join("") : '<div class="note">Проблем не найдено.</div>'}</div>`;
    if (tab === "stats") { const per = LEVELS.map(l => [l, VOCAB.filter(w => w.level === l).length]); ap.innerHTML = `<div class="grid g2"><div class="card"><h3>Слов по уровням</h3>${barChart(per, Math.max(...per.map(x => x[1])))}<table class="t">${per.map(([l, n]) => `<tr><td>${lv(l)}</td><td>${n} слов</td><td>${[...new Set(VOCAB.filter(w => w.level === l).map(w => w.topic))].length} тем</td></tr>`).join("")}</table></div><div class="card"><h3>Учебные материалы</h3><table class="t"><tr><td>Тем грамматики</td><td>${Object.values(GRAMMAR_TOPICS).flat().length}</td></tr><tr><td>Авторских уроков</td><td>${Object.keys(GRAMMAR_LESSONS).length + Object.keys(CUSTOM_LESSONS).length}</td></tr><tr><td>Текстов Reading</td><td>${READING.length}</td></tr><tr><td>Аудио Listening</td><td>${LISTENING.length}</td></tr><tr><td>Заданий Writing</td><td>${WRITING.length}</td></tr><tr><td>Вопросов Speaking</td><td>${SPEAKING.length}</td></tr><tr><td>Предложений Listen and Type</td><td>${DET_LISTEN.length}</td></tr><tr><td>Псевдослов (Read and Select)</td><td>${DET_PSEUDO.length}</td></tr><tr><td>Фраз и идиом</td><td>${Object.values(PHRASES).flat().length}</td></tr></table></div></div>`; }
  };
  draw();
};

// ===================== ЗАПУСК =====================
const App = {
  start() {
    loadVocab(); Audio.init();
    const resumed = Store.resume();
    if (resumed) (Store.state.custom.words || []).forEach(w => addWord(w)), Object.assign(CUSTOM_LESSONS, Store.state.custom.lessons || {});
    applyTheme();
    $("#menuBtn").onclick = e => { e.stopPropagation(); $("#side").classList.toggle("open"); };
    document.addEventListener("click", e => { const sd = $("#side"); if (sd.classList.contains("open") && !sd.contains(e.target)) sd.classList.remove("open"); });
    window.addEventListener("hashchange", route);
    window.addEventListener("beforeunload", () => { tick(); Store.flush(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) { tick(); Store.flush(); } });
    setInterval(tick, 60000);
    route();
    // Возможности платформы подключаются асинхронно; без них приложение работает локально.
    if (window.claude?.use) { Cloud.init(); Audio.initCap(); Mic.initCap(); AI.initCap(); } else { App.cloudReady(); }
  },
  cloudReady() { this.updateCloudBox(); if (Cloud.db && Cloud.uid && LS.get("ep_last", "") === "cloud_" + Cloud.uid && Store.mode !== "cloud") Cloud.connect().then(() => { (S().custom.words || []).forEach(w => addWord(w)); Object.assign(CUSTOM_LESSONS, S().custom.lessons || {}); applyTheme(); route(); }); },
  updateCloudBox() {
    const box = $("#cloudTxt"); if (!box) return;
    if (Cloud.db && Cloud.uid) { box.innerHTML = `Вы вошли в claude.ai — прогресс будет сохраняться в облаке и доступен на любом устройстве.`; if (!$("#cloudBtn")) box.insertAdjacentHTML("afterend", `<button class="btn acc" id="cloudBtn">Продолжить с аккаунтом Claude</button>`); $("#cloudBtn").onclick = async () => { $("#cloudBtn").disabled = true; const ok = await Cloud.connect(); if (ok) { (S().custom.words || []).forEach(w => addWord(w)); Object.assign(CUSTOM_LESSONS, S().custom.lessons || {}); App.afterLogin(!S().history.length); } else { toast("Не удалось подключиться к облаку"); $("#cloudBtn").disabled = false; } }; }
    else box.textContent = window.claude?.use ? "Облачное хранилище недоступно в этом просмотре (нужен вход в claude.ai). Используйте локальный профиль." : "Облачное хранилище недоступно. Используйте локальный профиль ниже.";
  },
  afterLogin(isNew) { markActive(); Store.save(true); applyTheme(); location.hash = isNew ? "diagnostic" : "home"; route(); },
  refreshAI() { if (CUR === "writing" || CUR === "chat" || CUR === "speaking" || CUR.startsWith("lesson-")) route(); }
};
App.start();

</script>
</body>
